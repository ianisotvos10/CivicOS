version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civicos_user
      POSTGRES_PASSWORD: civicos_password
      POSTGRES_DB: civicos_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP port (folosit de Spring Boot)
      - "8025:8025"   # Web UI pentru vizualizare emailuri
    restart: unless-stopped

volumes:
  postgres_data:
