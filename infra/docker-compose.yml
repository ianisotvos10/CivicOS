version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civicos_user
      POSTGRES_PASSWORD: civicos_password
      POSTGRES_DB: civicos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-service:
    build:
      context: ../backend-ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - db

  backend:
    build:
      context: ../backend-core
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - db
      - ai-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/civicos_db
      SPRING_DATASOURCE_USERNAME: civicos_user
      SPRING_DATASOURCE_PASSWORD: civicos_password
      AI_SERVICE_URL: http://ai-service:8000/classify
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP port (folosit de Spring Boot)
      - "8025:8025"   # Web UI pentru vizualizare emailuri
    restart: unless-stopped

volumes:
  postgres_data: