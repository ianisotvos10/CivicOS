# ====== Setari Server ======
server.port=8081
spring.application.name=CivicOS

# ====== Setari Baza de Date ======
# Docker Compose va expune serviciul PostgreSQL ca 'db' pe reteaua de aplicatii
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/civicos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:civicos_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:civicos_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ====== Setari Hibernate (ORM) ======
# 'update' creeaza/modifica tabelele automat in functie de clasele Java
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ====== Setari AI ======
app.ai.service-url=${AI_SERVICE_URL:http://localhost:8001/classify}

# ====== Setari CORS ======
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ====== Setari Securitate (Dezactivare temporara pentru dev) ======
spring.security.user.name=admin
spring.security.user.password=admin

# ====== Setari Email (MailHog pentru dev local) ======
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Hibernate DDL Auto - changing from update to validate
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# ====== Redis Cache ======
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
# Tipul de cache manager folosit de Spring
spring.cache.type=redis
# Prefix pentru cheile Redis (izolare per aplicatie)
spring.cache.redis.key-prefix=civicos::
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false
