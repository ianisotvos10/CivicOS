# ====== Setari Server ======
server.port=8081
spring.application.name=CivicOS

# ====== Setari Baza de Date ======
# Docker Compose va expune serviciul PostgreSQL ca 'db' pe reteaua de aplicatii
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/civicos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:civicos_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:civicos_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ====== Setari Hibernate (ORM) ======
# 'update' creeaza/modifica tabelele automat in functie de clasele Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ====== Setari AI ======
app.ai.service-url=${AI_SERVICE_URL:http://localhost:8001/classify}

# ====== Setari CORS ======
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ====== Setari Securitate (Dezactivare temporara pentru dev) ======
spring.security.user.name=admin
spring.security.user.password=admin

# ====== Setari Email (MailHog pentru dev local) ======
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
