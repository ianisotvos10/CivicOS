# ====== Profil DEV LOCAL (fara PostgreSQL, foloseste H2 in-memory) ======
# Pornire: java -jar app.jar --spring.profiles.active=dev
# sau: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev

server.port=8080

# H2 In-Memory Database (inclus deja in pom.xml)
spring.datasource.url=jdbc:h2:file:./data/civicos-dev;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (acces la http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# AI Service (fallback la localhost daca ai-service nu ruleaza)
app.ai.service-url=http://localhost:8000/classify

# CORS - permite frontend-ul React
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
